# Ash-Net: New Lawrence — Vorkonfigurierter ngIRCd (Andromeda Relay)

[Global]
    Name = irc.new-lawrence.ashnet
    AdminInfo1 = Ash-Net Enochian Relay
    AdminInfo2 = Harvelle's Roadhouse, New Lawrence
    AdminEMail = ash@roadhouse.ashnet
    Info = Ash-Net Terminal-MMORPG IRC Funk-Backend
    Listen = 0.0.0.0
    Ports = 6667
    ServerUID = irc
    ServerGID = irc
    MotdPhrase = "ASH-NET FUNKRELAIS AKTIV — HALT DEIN SALZ GRIFFBEREIT."

[Limits]
    ConnectRetry = 5
    MaxConnections = 500
    MaxConnectionsIP = 64
    MaxJoins = 16
    PingTimeout = 120
    PongTimeout = 30

[Options]
    DNS = no
    Ident = no
    PAM = no
    OperCanUseMode = yes
    AllowRemoteOper = yes

# Privilegierter Oper/Service-Zugang für `irc-bridge`
[Operator]
    Name = ashoper
    Password = enochian_oper_secret

# Verbindliche persistente Standard-Kanäle
[Channel]
    Name = #roadhouse
    Topic = Harvelle's Roadhouse — Sichere PvE-Schutzzone & Auftragsbrett
    Modes = nt

[Channel]
    Name = #new_lawrence
    Topic = New Lawrence Kolonie-Funk & Automatische Omen-Alarme (Kanal 4)
    Modes = nt

[Channel]
    Name = #zone_salzminen
    Topic = Salzminen von New Lawrence — Tagebau & Schwefelriss-Warnungen
    Modes = nt

[Channel]
    Name = #men_of_letters
    Topic = Relaisbunker der Männer der Schriften & Raid-Koordination
    Modes = nt
