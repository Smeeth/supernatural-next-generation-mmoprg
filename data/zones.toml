# Ash-Net: New Lawrence — Zone & NPC Definitions ("Die Neue Front", Andromeda System)

[[zones]]
id = "zone_roadhouse"
name = "Harvelle's Roadhouse (New Lawrence Randbezirk)"
irc_channel = "#roadhouse"
safe_sanctuary = true
default_omen = 0
boundary_east_x = 100.0
boundary_east_target = "zone_new_lawrence_west"
boundary_east_spawn_x = -90.0
boundary_east_spawn_y = 0.0
description = "Mit Henochischen Runen und Steinsalz gesicherte 0815-Jäger-Holzbar am Staubrand von New Lawrence. Verbindlicher Start- und Rückzugspunkt aller Jäger."

  [[zones.npcs]]
  id = "npc_ellen_harvelle"
  name = "Ellen Harvelles Echo"
  role = "Tresen & Auftragsbrett"
  pos_x = 0.0
  pos_y = 8.0
  greeting = "Willkommen im Roadhouse auf New Lawrence, Jäger. Da draußen reißen Höllentore auf und die Himmelsgarnison kennt keine Gnade. Halt dein Eisen griffbereit — außer du gehörst zum Fae-Hof."

  [[zones.npcs]]
  id = "npc_jo_harvelle"
  name = "Jo Harvelles Echo"
  role = "Quartiermeisterin"
  pos_x = -10.0
  pos_y = 6.0
  greeting = "Dein 16-teiliges graues Starter-Set sitzt? Gut. Wir werfen hier auf New Lawrence nichts weg — bring mir Steinsalz-Asche, dann weihen wir deine Ausrüstung auf Grün."

  [[zones.npcs]]
  id = "obj_ash_terminal"
  name = "Ashs Terminal"
  role = "Henochisches Mesh-Relais (Hinterzimmer)"
  pos_x = 12.0
  pos_y = -6.0
  greeting = "ASH-NET OS v4.2 [ENOCHIAN-QUIC-MESH STABLE] :: Abfrage aktiver Zonen-Knoten, Omen-Indizes und Kopfgelder bereit."

