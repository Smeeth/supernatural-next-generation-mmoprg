# SPDX-License-Identifier: GPL-3.0-or-later
# Ash-Net: New Lawrence — Server-First Terminal-MMORPG Workspace

[workspace]
resolver = "2"
members = [
    "crates/ash-core",
    "crates/ash-protocol",
    "crates/ash-db",
    "crates/ash-auth-gateway",
    "crates/ash-game-node",
    "crates/ash-irc-bridge",
    "crates/ash-test-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.dependencies]
ash-core = { path = "crates/ash-core" }
ash-protocol = { path = "crates/ash-protocol" }
ash-db = { path = "crates/ash-db" }

# Async runtime & utilities (MIT / Apache-2.0)
tokio = { version = "1.42", features = ["full"] }
bytes = "1.9"
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
clap = { version = "4.5", features = ["derive", "env"] }

# Serialization & config (MIT / Apache-2.0)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
toml = "0.8"

# QUIC & TLS 1.3 / mTLS without OpenSSL dependency (MIT / Apache-2.0 / ISC)
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
rustls-pemfile = "2.2"
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring", "pem"] }

# Headless ECS (MIT / Apache-2.0)
hecs = "0.10"

# Database & Cache (MIT / Apache-2.0)
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "postgres",
    "macros",
    "migrate",
    "uuid",
    "chrono",
    "json",
] }
redis = { version = "0.27", default-features = false, features = ["tokio-comp", "aio"] }

# Auth, IDs, Time & RNG (MIT / Apache-2.0)
argon2 = "0.5"
rand = "0.8"
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
